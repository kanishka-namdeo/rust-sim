[package]
name = "sitsim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rustsitsim binary: scenario runner, REST/WS control plane, replay tooling"

[[bin]]
name = "sitsim-cli"
path = "src/main.rs"

[dependencies]
sitsim-core = { path = "../sitsim-core" }
sitsim-env = { path = "../sitsim-env" }
sitsim-fault = { path = "../sitsim-fault" }
sitsim-mavlink = { path = "../sitsim-mavlink" }
sitsim-sdk = { path = "../sitsim-sdk" }
sitsim-transport = { path = "../sitsim-transport" }
axum = { version = "0.7", features = ["ws"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
