[package]
name = "sitsim-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TCP HIL link: listener, reader/writer tasks, COMMAND_LONG 511 rate negotiation, lockstep counters (SPEC §3.1, §3.4, §3.10)"

[dependencies]
sitsim-mavlink = { path = "../sitsim-mavlink" }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
