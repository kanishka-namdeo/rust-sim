# Fault-injection showcase: one event per fault family from SPEC §7.1.
# Safe to run against a booted PX4; the GPS denial is the I-4a window.

[io]
tcp_port = 4560
api_port = 8200

[sim]
rate_hz = 200
duration_s = 120
seed = 42

[env]
wind_steady_ms = [0.0, 0.0, 0.0]
turbulence = "light"

[[fault]]
id = "denial_1"
type = "gps_denial"
start_ms = 30000
duration_ms = 20000

[[fault]]
id = "motor2_degrade"
type = "motor_efficiency"
start_ms = 90000
motor = 2
factor = 0.55
persistent = true

[[fault]]
id = "baro_creep"
type = "baro_drift"
start_ms = 60000
duration_ms = 30000
rate_per_s = 0.05

[[fault]]
id = "gust"
type = "wind_event"
start_ms = 45000
duration_ms = 15000
wind_gust_ms = [4.0, 0.0, 0.0]
rise_s = 3.0
