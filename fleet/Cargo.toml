[workspace]
resolver = "2"
members = [
    "crates/fleet-core",
    "crates/fleet-mavlink",
    "crates/fleet-modes",
    "crates/fleet-safety",
    "crates/fleet-mission",
    "crates/fleet-simctl",
    "crates/fleet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/example/mavfleet"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }

[profile.dev]
opt-level = 1
