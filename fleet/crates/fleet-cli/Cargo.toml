[package]
name = "fleet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "mavfleet binary: fleet bring-up, supervisor, REST/WS control plane"

[[bin]]
name = "mavfleet"
path = "src/main.rs"

[[bin]]
name = "fleet-supervisor"
path = "src/bin/supervisor.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
fleet-core = { path = "../fleet-core" }
fleet-mavlink = { path = "../fleet-mavlink" }
fleet-modes = { path = "../fleet-modes" }
fleet-safety = { path = "../fleet-safety" }
fleet-mission = { path = "../fleet-mission" }
fleet-simctl = { path = "../fleet-simctl" }
# M5 (Fleet C2): reqwest drives the per-vehicle mission fetch from the
# :8300 catalog (`GET /api/missions/{id}`) when `POST /api/fleet/start`
# uploads + arms the fleet. Same features the catalog uses for its own
# PX4-version probe.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# tower is already in the workspace tree via axum; the util feature powers
# the router-level integration tests (oneshot).
tower = { version = "0.5", features = ["util"] }
